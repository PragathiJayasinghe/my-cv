<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV - Pragathi Jayasinghe</title>
  <meta name="description" content="CV of Pragathi Jayasinghe - Information Technology undergraduate at the University of Moratuwa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f0c;
      --panel: #121612;
      --border: #2a332a;
      --green: #3ecf6e;
      --green-dim: #1f7a3d;
      --amber: #c9a227;
      --text: #c8d6c8;
      --muted: #6b7a6b;
      --chrome: #1a221a;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, #1a2e1a 0%, transparent 55%),
        var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      gap: 0.75rem;
      min-height: 100%;
    }

    .window {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(62, 207, 110, 0.04),
        0 24px 48px rgba(0, 0, 0, 0.45);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.55rem 0.85rem;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      user-select: none;
    }

    .dots {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3a453a;
    }
    .dots span:nth-child(1) { background: #e25555; }
    .dots span:nth-child(2) { background: #e2b04a; }
    .dots span:nth-child(3) { background: #3ecf6e; }

    .titlebar .title {
      flex: 1;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .actions a {
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--green);
      background: transparent;
      border: 1px solid var(--green-dim);
      padding: 0.28rem 0.55rem;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .actions a:hover {
      background: rgba(62, 207, 110, 0.12);
      border-color: var(--green);
      color: #7dffab;
    }

    .actions a.secondary {
      color: var(--muted);
      border-color: var(--border);
    }

    .actions a.secondary:hover {
      color: var(--text);
      border-color: var(--muted);
      background: rgba(200, 214, 200, 0.06);
    }

    .viewer-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #1e241e;
    }

    .viewer-wrap::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      opacity: 0.4;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #525659;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.35rem 0.85rem;
      font-size: 0.68rem;
      color: var(--muted);
      background: var(--chrome);
      border-top: 1px solid var(--border);
    }

    .status .live::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 0.4rem;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      vertical-align: 0.05em;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (max-width: 640px) {
      .titlebar .title { display: none; }
      body { padding: 0.5rem; }
    }
  </style>
</head>
<body>

  <div class="window" role="region" aria-label="CV viewer">
    <div class="titlebar">
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="title">Pragathi_Jayasinghe_CV.pdf | PragathiJayasinghe</div>
      <div class="actions">
        <a class="secondary" href="Pragathi_Jayasinghe_CV.pdf" target="_blank" rel="noopener">open</a>
        <a href="Pragathi_Jayasinghe_CV.pdf" download="Pragathi_Jayasinghe_CV.pdf">download</a>
      </div>
    </div>
    <div class="viewer-wrap">
      <iframe src="Pragathi_Jayasinghe_CV.pdf#view=FitH" title="Pragathi Jayasinghe CV"></iframe>
    </div>
    <div class="status">
      <span class="live">previewing Pragathi_Jayasinghe_CV.pdf</span>
      <span>Copyright &copy; 2026 Pragathi Jayasinghe. All rights reserved.</span>
    </div>
  </div>

</body>
</html>
