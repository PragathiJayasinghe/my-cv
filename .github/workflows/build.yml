name: Build, Release, and Deploy CV

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Prepare build assets
        run: |
          # Rename compiled PDF
          cp main.pdf Pragathi_Jayasinghe_CV.pdf

          # Create directory for GitHub Pages
          mkdir -p public
          cp Pragathi_Jayasinghe_CV.pdf public/

          # Create auto-redirect page for GitHub Pages
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=./Pragathi_Jayasinghe_CV.pdf" />
              <title>Pragathi Jayasinghe - CV</title>
            </head>
            <body>
              <p>Redirecting to CV... <a href="./Pragathi_Jayasinghe_CV.pdf">Click here</a> if not redirected.</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pragathi_Jayasinghe_CV.pdf
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_pages:
    needs: build_latex
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4